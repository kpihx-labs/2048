[package]
name = "terminal-2048"
version = "1.1.0"
edition = "2021"
description = "A responsive, configurable 2048 game for the terminal"
license = "GPL-3.0-or-later"
repository = "https://github.com/kpihx-labs/2048"

[[bin]]
name = "2048"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tui-big-text = "0.8.10"
ratatui-core = "0.1.2"
